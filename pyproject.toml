[build-system]
# Project is not packaged; this section exists only so tooling that demands
# a pyproject.toml (ruff, pip-tools, etc.) is happy.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webapp-flaskscrcpy"
version = "0.2.0"
description = "Flask + Vue web frontend for scrcpy, with optional WebRTC video pipeline."
requires-python = ">=3.10"
dependencies = [
    "playwright~=1.60.0",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

# ---------- ruff ----------
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    ".venv",
    "frontend",
    "resources",
    "**/__pycache__",
]

[tool.ruff.lint]
# E,F: pyflakes/pycodestyle core
# I:    import order
# B:    flake8-bugbear (catches the broad-except patterns that were flagged)
# UP:   pyupgrade hints
# RUF:  ruff-specific
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line length — handled by formatter, not hard-fail
    "B008",   # function calls in argument defaults (common in Flask)
    "UP007",  # `X | Y` union syntax — keep Optional for clarity in stubs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]                              # asserts in tests are fine

# ---------- black ----------
[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.venv
  | frontend
  | resources
  | __pycache__
)/
'''
