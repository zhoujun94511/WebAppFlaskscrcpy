  (3) 违法所得 5000 元以上或者造成经济损失 1 万元以上的;
  (4) 造成为 100 台以上计算机信息系统提供域名解析、身份认证、计费等
      基础服务或者为 1 万以上用户提供服务的计算机信息系统不能正常运行
      累计 1 小时以上的;
  (5) 造成其他严重后果的。

  ─── 破坏计算机信息系统“后果特别严重”的认定标准 ───
  实施前款规定行为,具有下列情形之一的,应当认定为破坏计算机信息系统
  "后果特别严重":
  (1) 数量或者数额达到前款第 (1) 项至第 (3) 项规定标准 5 倍以上的;
  (2) 造成为 500 台以上计算机信息系统提供域名解析、身份认证、计费等
      基础服务或者为 5 万以上用户提供服务的计算机信息系统不能正常
      运行累计 1 小时以上的;
  (3) 破坏国家机关或者金融、电信、交通、教育、医疗、能源等领域提供
      公共服务的计算机信息系统的功能、数据或者应用程序,致使生产、
      生活受到严重影响或者造成恶劣社会影响的;
  (4) 造成其他特别严重后果的。

  ─── 制作传播破坏性程序“后果严重”的认定标准 ───
  故意制作、传播计算机病毒等破坏性程序,影响计算机系统正常运行,
  具有下列情形之一的,应当认定为刑法第二百八十六条第三款规定的
  "后果严重":
  (1) 制作、提供、传输计算机病毒等破坏性程序,导致该程序通过网络、
      存储介质、文件等媒介传播的;
  (2) 造成 20 台以上计算机系统被植入第五条第 (2)、(3) 项规定的
      程序的;
  (3) 提供计算机病毒等破坏性程序 10 人次以上的;
  (4) 违法所得 5000 元以上或者造成经济损失 1 万元以上的;
  (5) 造成其他严重后果的。

  ─── 制作传播破坏性程序“后果特别严重”的认定标准 ───

      或者造成恶劣社会影响的;
  (2) 数量或者数额达到前款第 (2) 项至第 (4) 项规定标准 5 倍以上的;
  (3) 造成其他特别严重后果的。
