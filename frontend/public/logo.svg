<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="WebAppFlaskScrcpy">
  <!-- Brand mark: an Android device showing the Android robot on its screen
       = "remote control of an Android device". Single source of truth —
       referenced by the favicon, the nav rail, the login screen and the README. -->
  <defs>
    <linearGradient id="wafsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="68" fill="url(#wafsBg)"/>

  <!-- device -->
  <rect x="74" y="34" width="108" height="188" rx="27.2" fill="#0c1530"/>
  <rect x="74" y="34" width="108" height="188" rx="27.2" fill="none" stroke="#eaf1ff" stroke-width="12"/>
  <rect x="108.8" y="53.6" width="38.4" height="9.2" rx="4.6" fill="#eaf1ff" opacity="0.6"/>

  <!-- Android robot head on the screen -->
  <g stroke="#3ddc84" stroke-width="7" stroke-linecap="round">
    <line x1="110" y1="126" x2="101" y2="107"/>
    <line x1="146" y1="126" x2="155" y2="107"/>
  </g>
  <path d="M94 154 a34 34 0 0 1 68 0 Z" fill="#3ddc84"/>
  <circle cx="117" cy="137" r="5" fill="#0c1530"/>
  <circle cx="139" cy="137" r="5" fill="#0c1530"/>
</svg>
